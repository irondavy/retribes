<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>retribes</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; }
      canvas { display: block; }

      #blocker {
        position: fixed;
        top: 0; bottom: 0; right: 0;
        background: rgba(0, 0, 0, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 10;
      }

      #blocker .prompt {
        color: #fff;
        font-family: system-ui, sans-serif;
        text-align: center;
      }

      #blocker .prompt h1 {
        font-size: 2rem;
        margin-bottom: 0.5rem;
      }

      #blocker .prompt p {
        font-size: 1rem;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div id="blocker">
      <div class="prompt">
        <h1>retribes</h1>
        <p>Click to play — WASD move, Space/RMB jet, Shift ski, R respawn, I invert-Y</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
